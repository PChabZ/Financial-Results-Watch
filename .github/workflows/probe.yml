name: Probe (temporaire)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python probe.py
      - run: |
          git config user.name "ir-watch-bot"; git config user.email "ir-watch-bot@users.noreply.github.com"
          git add state/probe.json && git commit -m "probe" && git pull --rebase && git push
