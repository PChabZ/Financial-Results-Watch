# Pages surveillées. Pour ajouter une entreprise : copier un bloc, changer slug/name/url.
#
# include : regex appliquée à l'URL des liens. Seuls les liens qui matchent sont suivis.
#           Par défaut : documents (.pdf, .xls, .xlsx, .xlsm).
# exclude : regex des liens à ignorer (bruit récurrent).
# scope   : (optionnel) sélecteur CSS pour limiter la zone lue de la page.

sites:
  - slug: rexel
    name: Rexel
    url: https://www.rexel.com/fr/investisseurs/resultats-financiers

  # Schneider et Bouygues bloquent les accès depuis GitHub : on lit leurs communiqués
  # officiels sur Euronext (titres filtrés : résultats / chiffre d'affaires uniquement).
  - slug: schneider
    name: Schneider Electric
    type: euronext
    url: https://live.euronext.com/fr/listview/company-press-release/003751
    see_also: https://www.se.com/ww/fr/about-us/investor-relations/financial-results/

  - slug: legrand
    name: Legrand
    url: https://www.legrand.com/fr/investisseurs-et-actionnaires/chiffres-cles-etats-financiers
    # PDF des états financiers + communiqué "Publication du ..." (publié avant les comptes)
    include: '(\.pdf(\?|$)|/actualites/(publication|chiffre-daffaires|resultats))'

  - slug: eiffage
    name: Eiffage
    url: https://www.eiffage.com/finance/resultats

  - slug: vinci
    name: VINCI
    url: https://www.vinci.com/finances/investisseurs/historique-resultats

  - slug: bouygues
    name: Bouygues
    type: euronext
    url: https://live.euronext.com/fr/listview/company-press-release/003126
    see_also: https://www.bouygues.com/resultats/

  - slug: bilfinger
    name: Bilfinger
    url: https://www.bilfinger.com/en/investors/publications/quarterly-reporting/
    # Certificat du serveur Bilfinger incomplet : vérification désactivée pour ce site
    # (lecture seule d'une page publique, aucune donnée envoyée)
    insecure: true

  - slug: elecnor
    name: Elecnor
    url: https://www.grupoelecnor.com/quarterly-results
